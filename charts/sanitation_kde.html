<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation vs Life Expectancy KDE Plot</title>
    
    <!-- D3.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <!-- D3 Contour for density visualization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-contour/4.0.2/d3-contour.min.js"></script>
    
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #chart {
            display: flex;
            justify-content: center;
        }
        
        .axis-label {
            font-size: 14px;
            font-weight: 600;
        }
        
        .contour-path {
            fill: none;
            stroke: #666;
            stroke-width: 1.5;
            stroke-linejoin: round;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .loading {
            text-align: center;
            color: #666;
            font-size: 16px;
            padding: 40px;
        }
        
        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            padding: 20px;
            border-radius: 8px;
            color: #c33;
            margin: 20px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="chart">
        <div class="loading">Loading data...</div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // Color scheme matching your other visualizations
        const continentColors = {
            'Africa': '#4e79a7',      // Blue
            'Asia': '#f28e2c',        // Orange
            'Europe': '#e15759',      // Red
            'North America': '#76b7b2', // Teal
            'Oceania': '#59a14f',     // Green
            'South America': '#edc949' // Yellow
        };

        // D3 KDE Visualization for Sanitation vs Life Expectancy
        async function loadAndVisualize() {
            try {
                const response = await fetch('../Global Health.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const fileData = await response.text();
                
                const parsed = Papa.parse(fileData, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true
                });

                let data = parsed.data;
                
                if (data.length > 0) {
                    console.log('Available columns:', Object.keys(data[0]));
                }
                
                const sanitationCol = Object.keys(data[0]).find(key => 
                    key.toLowerCase().includes('sanitation') && key.toLowerCase().includes('total')
                );
                const lifeExpectancyCol = Object.keys(data[0]).find(key => 
                    key.toLowerCase().includes('life') && key.toLowerCase().includes('expectancy')
                );
                const continentCol = Object.keys(data[0]).find(key => 
                    key.toLowerCase().includes('continent')
                );
                
                console.log('Sanitation column:', sanitationCol);
                console.log('Life expectancy column:', lifeExpectancyCol);
                console.log('Continent column:', continentCol);
                
                if (!sanitationCol || !lifeExpectancyCol) {
                    document.getElementById('chart').innerHTML = 
                        `<div class="error-message">Could not find required columns.</div>`;
                    return;
                }
                
                data = data.filter(d => 
                    d[sanitationCol] != null && 
                    d[lifeExpectancyCol] != null &&
                    !isNaN(d[sanitationCol]) &&
                    !isNaN(d[lifeExpectancyCol])
                );

                if (data.length === 0) {
                    document.getElementById('chart').innerHTML = 
                        '<div class="error-message">No valid data found after filtering</div>';
                    return;
                }

                console.log(`Loaded ${data.length} valid data points`);

                createKDEPlot(data, sanitationCol, lifeExpectancyCol, continentCol);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('chart').innerHTML = 
                    `<div class="error-message">Error loading data: ${error.message}</div>`;
            }
        }

        function createKDEPlot(data, sanitationCol, lifeExpectancyCol, continentCol) {
            document.getElementById('chart').innerHTML = '';

            const margin = { top: 40, right: 40, bottom: 70, left: 70 };
            const width = 1000 - margin.left - margin.right;
            const height = 650 - margin.top - margin.bottom;

            const svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // Scales
            const x = d3.scaleLinear()
                .domain([0, 100])
                .range([0, width]);

            const y = d3.scaleLinear()
                .domain([30, 90])
                .range([height, 0]);

            // Calculate 2D density for contours
            const densityData = d3.contourDensity()
                .x(d => x(d[sanitationCol]))
                .y(d => y(d[lifeExpectancyCol]))
                .size([width, height])
                .bandwidth(30)
                .thresholds(15)
                (data);

            // Get min and max density values
            const minDensity = d3.min(densityData, d => d.value);
            const maxDensity = d3.max(densityData, d => d.value);

            console.log('Min density:', minDensity, 'Max density:', maxDensity);
            console.log('Total data points:', data.length);

            // Color scale for contours
            const colorScale = d3.scaleSequential(d3.interpolateYlGnBu)
                .domain([minDensity, maxDensity]);

            // Draw filled contours
            svg.selectAll("path.density")
                .data(densityData)
                .enter()
                .append("path")
                .attr("class", "density")
                .attr("d", d3.geoPath())
                .attr("fill", d => colorScale(d.value))
                .attr("opacity", 0.6)
                .attr("stroke", "#fff")
                .attr("stroke-width", 0.5);

            // Tooltip
            const tooltip = d3.select("#tooltip");

            // Draw scatter points colored by continent
            svg.selectAll("circle")
                .data(data)
                .enter()
                .append("circle")
                .attr("cx", d => x(d[sanitationCol]))
                .attr("cy", d => y(d[lifeExpectancyCol]))
                .attr("r", 4)
                .attr("fill", d => continentCol ? (continentColors[d[continentCol]] || '#999') : '#4e79a7')
                .attr("stroke", "white")
                .attr("stroke-width", 1)
                .attr("opacity", 0.7)
                .on("mouseover", function(event, d) {
                    d3.select(this)
                        .attr("r", 7)
                        .attr("opacity", 1)
                        .attr("stroke-width", 2);
                    
                    tooltip
                        .style("opacity", 1)
                        .html(`
                            ${continentCol && d[continentCol] ? `<strong>${d[continentCol]}</strong><br>` : ''}
                            Sanitation: ${d[sanitationCol].toFixed(1)}%<br>
                            Life Expectancy: ${d[lifeExpectancyCol].toFixed(1)} years
                        `)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this)
                        .attr("r", 4)
                        .attr("opacity", 0.7)
                        .attr("stroke-width", 1);
                    
                    tooltip.style("opacity", 0);
                });

            // X axis
            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).ticks(10))
                .selectAll("text")
                .style("font-size", "12px");

            // Y axis
            svg.append("g")
                .call(d3.axisLeft(y))
                .selectAll("text")
                .style("font-size", "12px");

            // Title
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", -15)
                .attr("text-anchor", "middle")
                .style("font-size", "20px")
                .style("font-weight", "600")
                .style("fill", "#333")
                .text("Sanitation vs Life Expectancy (KDE Plot)");

            // X axis label
            svg.append("text")
                .attr("class", "axis-label")
                .attr("x", width / 2)
                .attr("y", height + 50)
                .attr("text-anchor", "middle")
                .text("Safely Managed Sanitation (% of population)");

            // Y axis label
            svg.append("text")
                .attr("class", "axis-label")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", -50)
                .attr("text-anchor", "middle")
                .text("Life Expectancy (years)");

            // Add density legend (bottom left)
            const legendWidth = 200;
            const legendHeight = 15;
            
            const legend = svg.append("g")
                .attr("transform", `translate(20, ${height - 50})`);

            // Create gradient for legend
            const defs = svg.append("defs");
            const gradient = defs.append("linearGradient")
                .attr("id", "density-gradient")
                .attr("x1", "0%")
                .attr("x2", "100%")
                .attr("y1", "0%")
                .attr("y2", "0%");

            // Add color stops to gradient
            const numStops = 10;
            for (let i = 0; i <= numStops; i++) {
                const offset = i / numStops;
                const densityValue = minDensity + (maxDensity - minDensity) * offset;
                gradient.append("stop")
                    .attr("offset", `${offset * 100}%`)
                    .attr("stop-color", colorScale(densityValue));
            }

            // Draw legend rectangle
            legend.append("rect")
                .attr("width", legendWidth)
                .attr("height", legendHeight)
                .style("fill", "url(#density-gradient)")
                .style("stroke", "#999")
                .style("stroke-width", 1);

            // Add legend axis with actual density values
            const legendScale = d3.scaleLinear()
                .domain([0, 1000])
                .range([0, legendWidth]);

            const legendAxis = d3.axisBottom(legendScale)
                .ticks(5)
                .tickFormat(d => d.toFixed(0));

            legend.append("g")
                .attr("transform", `translate(0, ${legendHeight})`)
                .call(legendAxis)
                .selectAll("text")
                .style("font-size", "10px");

            // Legend title
            legend.append("text")
                .attr("x", legendWidth / 2)
                .attr("y", -5)
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .style("font-weight", "600")
                .text("Density");
        }

        window.addEventListener('DOMContentLoaded', loadAndVisualize);
    </script>
</body>
</html>
