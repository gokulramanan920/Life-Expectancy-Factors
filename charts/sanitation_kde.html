<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitation vs Life Expectancy KDE Plot</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-contour/4.0.2/d3-contour.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: white;
        }
        
        #chart {
            text-align: center;
            margin-top: 50px;
        }
        
        .tooltip {
            position: absolute;
            background: black;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
        
        .loading {
            text-align: center;
            font-size: 16px;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div id="chart">
        <div class="loading">Loading...</div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // Colors for each continent
        var continentColors = {
            'Africa': '#4e79a7',
            'Asia': '#f28e2c',
            'Europe': '#e15759',
            'North America': '#76b7b2',
            'Oceania': '#59a14f',
            'South America': '#edc949'
        };

        // Load CSV data
        function loadData() {
            fetch('../Global Health.csv')
                .then(function(response) {
                    return response.text();
                })
                .then(function(csvText) {
                    var parsed = Papa.parse(csvText, {
                        header: true,
                        dynamicTyping: true,
                        skipEmptyLines: true
                    });
                    processData(parsed.data);
                })
                .catch(function(error) {
                    document.getElementById('chart').innerHTML = '<div>Error loading data</div>';
                });
        }

        // Find column names and filter data
        function processData(rawData) {
            var sanitationCol = null;
            var lifeExpCol = null;
            var continentCol = null;
            
            // Find the right columns
            var columns = Object.keys(rawData[0]);
            for (var i = 0; i < columns.length; i++) {
                var col = columns[i].toLowerCase();
                if (col.includes('sanitation') && col.includes('total')) {
                    sanitationCol = columns[i];
                }
                if (col.includes('life') && col.includes('expectancy')) {
                    lifeExpCol = columns[i];
                }
                if (col.includes('continent')) {
                    continentCol = columns[i];
                }
            }
            
            // Filter out null values
            var cleanData = [];
            for (var i = 0; i < rawData.length; i++) {
                var row = rawData[i];
                if (row[sanitationCol] != null && row[lifeExpCol] != null) {
                    cleanData.push(row);
                }
            }
            
            makePlot(cleanData, sanitationCol, lifeExpCol, continentCol);
        }

        // Create the visualization
        function makePlot(data, sanitationCol, lifeExpCol, continentCol) {
            document.getElementById('chart').innerHTML = '';

            var margin = {top: 40, right: 40, bottom: 70, left: 70};
            var width = 1000 - margin.left - margin.right;
            var height = 650 - margin.top - margin.bottom;

            var svg = d3.select("#chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

            // X and Y scales
            var xScale = d3.scaleLinear()
                .domain([0, 100])
                .range([0, width]);

            var yScale = d3.scaleLinear()
                .domain([30, 90])
                .range([height, 0]);

            // Create density contours
            var density = d3.contourDensity()
                .x(function(d) { return xScale(d[sanitationCol]); })
                .y(function(d) { return yScale(d[lifeExpCol]); })
                .size([width, height])
                .bandwidth(30)
                .thresholds(15);
            
            var contours = density(data);
            
            var minDensity = d3.min(contours, function(d) { return d.value; });
            var maxDensity = d3.max(contours, function(d) { return d.value; });

            // Color scale
            var colorScale = d3.scaleSequential(d3.interpolateYlGnBu)
                .domain([minDensity, maxDensity]);

            // Draw contours
            svg.selectAll("path")
                .data(contours)
                .enter()
                .append("path")
                .attr("d", d3.geoPath())
                .attr("fill", function(d) { return colorScale(d.value); })
                .attr("opacity", 0.6)
                .attr("stroke", "white")
                .attr("stroke-width", 0.5);

            var tooltip = d3.select("#tooltip");

            // Draw points
            svg.selectAll("circle")
                .data(data)
                .enter()
                .append("circle")
                .attr("cx", function(d) { return xScale(d[sanitationCol]); })
                .attr("cy", function(d) { return yScale(d[lifeExpCol]); })
                .attr("r", 4)
                .attr("fill", function(d) {
                    if (continentCol && d[continentCol]) {
                        return continentColors[d[continentCol]] || '#999';
                    }
                    return '#4e79a7';
                })
                .attr("stroke", "white")
                .attr("stroke-width", 1)
                .attr("opacity", 0.7)
                .on("mouseover", function(event, d) {
                    d3.select(this).attr("r", 7).attr("opacity", 1);
                    
                    var content = '';
                    if (continentCol && d[continentCol]) {
                        content += '<b>' + d[continentCol] + '</b><br>';
                    }
                    content += 'Sanitation: ' + d[sanitationCol].toFixed(1) + '%<br>';
                    content += 'Life Expectancy: ' + d[lifeExpCol].toFixed(1) + ' years';
                    
                    tooltip.html(content)
                        .style("display", "block")
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this).attr("r", 4).attr("opacity", 0.7);
                    tooltip.style("display", "none");
                });

            // Add axes
            var xAxis = d3.axisBottom(xScale).ticks(10);
            var yAxis = d3.axisLeft(yScale);

            svg.append("g")
                .attr("transform", "translate(0," + height + ")")
                .call(xAxis);

            svg.append("g")
                .call(yAxis);

            // Add title
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", -15)
                .attr("text-anchor", "middle")
                .style("font-size", "20px")
                .style("font-weight", "bold")
                .text("Sanitation vs Life Expectancy (KDE Plot)");

            // X label
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", height + 50)
                .attr("text-anchor", "middle")
                .style("font-size", "14px")
                .text("Safely Managed Sanitation (% of population)");

            // Y label
            svg.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", -50)
                .attr("text-anchor", "middle")
                .style("font-size", "14px")
                .text("Life Expectancy (years)");

            // Add legend
            var legendWidth = 200;
            var legendHeight = 15;
            
            var legend = svg.append("g")
                .attr("transform", "translate(20," + (height - 50) + ")");

            // Gradient
            var gradient = svg.append("defs")
                .append("linearGradient")
                .attr("id", "grad");

            for (var i = 0; i <= 10; i++) {
                var pct = i / 10;
                var val = minDensity + (maxDensity - minDensity) * pct;
                gradient.append("stop")
                    .attr("offset", (pct * 100) + "%")
                    .attr("stop-color", colorScale(val));
            }

            legend.append("rect")
                .attr("width", legendWidth)
                .attr("height", legendHeight)
                .style("fill", "url(#grad)")
                .style("stroke", "#999");

            var legendScale = d3.scaleLinear()
                .domain([0, 1000])
                .range([0, legendWidth]);

            var legendAxis = d3.axisBottom(legendScale).ticks(5);

            legend.append("g")
                .attr("transform", "translate(0," + legendHeight + ")")
                .call(legendAxis)
                .selectAll("text")
                .style("font-size", "10px");

            legend.append("text")
                .attr("x", legendWidth / 2)
                .attr("y", -5)
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .style("font-weight", "bold")
                .text("Density");
        }

        // Start loading when page loads
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
